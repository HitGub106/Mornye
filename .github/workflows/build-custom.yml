
name: Build Custom Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      MORNYE_DISCORD_SDK: "0"
      MORNYE_RUST_ANDROID_ABIS: arm64-v8a
      GRADLE_OPTS: "-Dorg.gradle.caching=true"

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          df -h

      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      # Use the wrapper already pinned by Mornye, and persist its caches.
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false
          gradle-home-cache-includes: |
            caches/modules-2
            caches/build-cache-1
            wrapper/dists

      # Cache only the required Android tool versions, not the whole SDK.
      - name: Cache Android SDK packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/30.0.16248370
            /usr/local/lib/android/sdk/platforms/android-37.0
            /usr/local/lib/android/sdk/build-tools/37.0.0
            /usr/local/lib/android/sdk/cmake/4.1.2
          key: mornye-android-sdk-v1-${{ runner.os }}-${{ runner.arch }}-ndk30.0.16248370-api37.0-bt37.0.0-cmake4.1.2

      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.16248370" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;4.1.2"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Setup Rust
        working-directory: rust_backend
        run: rustup show

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      # Same Cargo target directory used by scripts/build_rust_backend.sh.
      # A new Rust source hash gets a new cache, with a compatible fallback.
      - name: Cache Cargo registry and Rust build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust_backend/target
          key: mornye-cargo-v1-${{ runner.os }}-${{ runner.arch }}-android-arm64-ndk30.0.16248370-${{ hashFiles('rust_backend/rust-toolchain.toml', 'rust_backend/Cargo.lock') }}-${{ hashFiles('rust_backend/**/*.rs', 'rust_backend/**/*.toml', 'rust_backend/**/*.js', 'rust_backend/**/*.tsv', 'rust_backend/**/*.pem', 'scripts/build_rust_backend.sh') }}
          restore-keys: |
            mornye-cargo-v1-${{ runner.os }}-${{ runner.arch }}-android-arm64-ndk30.0.16248370-${{ hashFiles('rust_backend/rust-toolchain.toml', 'rust_backend/Cargo.lock') }}-

      - name: Install Flutter dependencies
        run: flutter pub get

      # build_android.sh already prepares the SDK patch and generates l10n.

      - name: Build APK
        run: bash scripts/build_android.sh --lite

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Mornye-Custom-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7
